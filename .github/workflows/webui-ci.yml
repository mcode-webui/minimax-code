name: WebUI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    name: WebUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set isolated WebUI output directories
        shell: bash
        run: |
          echo "MCODE_WEBUI_VERIFY_DIR=$RUNNER_TEMP/webui-package-checks" >> "$GITHUB_ENV"
          echo "WEBUI_BROWSER_OUTPUT_DIR=$RUNNER_TEMP/webui-browser-results" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "WEBUI_BROWSER_HEADED=1" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check WebUI types
        run: pnpm typecheck:webui
      - name: Check WebUI dependency boundaries
        run: pnpm check:webui-dependency
      - name: Check WebUI presentation rules
        run: pnpm check:webui-presentation
      - name: Check WebUI motion rules
        run: pnpm check:webui-motion
      - name: Check WebUI overlays
        run: pnpm check:webui-overlays
      - name: Check WebUI feedback
        run: pnpm check:webui-feedback
      - name: Build WebUI
        id: build
        run: pnpm build:webui
      - name: Check WebUI build boundaries
        run: pnpm check:webui-boundary
      - name: Install Chromium
        id: browsers
        run: pnpm install:webui-browsers
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - name: Test WebUI units and integrations
        run: pnpm test:webui
      - name: Test WebUI browser interactions
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browsers.outcome == 'success' }}
        run: pnpm test:webui-browser
      - name: Verify WebUI package installation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:webui-package
      - name: Upload WebUI browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webui-browser-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webui-browser-results/
          retention-days: 7
          if-no-files-found: ignore

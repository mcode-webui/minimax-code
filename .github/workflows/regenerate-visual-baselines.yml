name: Regenerate visual baselines (temporary)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to record the baselines from"
        required: true
        type: string

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # The recording only needs a working install; the lockfile's agreement with
      # package.json is the subject of another pull request, so it does not gate this.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:webui
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test packages/webui/test/browser/visual-baselines.spec.mjs packages/webui/test/browser/responsive-baselines.spec.mjs --update-snapshots
      # The shared dialog's own backdrop changed, so the screenshots that show it
      # are older than the surfaces they show.
      - run: pnpm exec playwright test packages/webui/test/browser/plugin-catalogue-layout.spec.mjs packages/webui/test/browser/scheduling-panel.spec.mjs --update-snapshots
      # The manifest of the measured surfaces. The recorder writes what it
      # measures, and the surfaces the shared dialog moved are measured again.
      - run: pnpm exec playwright test packages/webui/test/browser/rendering-integrity.spec.mjs
        env:
          RECORD_RENDERING_INTEGRITY: "1"
      # The artifacts are uploaded whatever the recording steps did: a run that
      # failed on one spec still holds the recordings the other specs made.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-visual-baselines
          path: |
            packages/webui/test/browser/visual-baselines.spec.mjs-snapshots
            packages/webui/test/browser/responsive-baselines.spec.mjs-snapshots
            packages/webui/test/browser/plugin-catalogue-layout.spec.mjs-snapshots
            packages/webui/test/browser/scheduling-panel.spec.mjs-snapshots
            packages/webui/test/browser/support/rendering-integrity.json

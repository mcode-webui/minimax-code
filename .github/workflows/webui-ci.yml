name: WebUI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  webui:
    name: WebUI (${{ matrix.os }}, ${{ matrix.lane.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lane:
          - name: checks
          - name: units
          - name: browser-1
            shard: "1/3"
          - name: browser-2
            shard: "2/3"
          - name: browser-3
            shard: "3/3"
          - name: package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set isolated WebUI output directories
        if: matrix.lane.name != 'checks'
        shell: bash
        run: |
          echo "MCODE_WEBUI_VERIFY_DIR=$RUNNER_TEMP/webui-package-checks" >> "$GITHUB_ENV"
          echo "WEBUI_PLAYWRIGHT_OUTPUT_DIR=$RUNNER_TEMP/webui-playwright-results" >> "$GITHUB_ENV"
          echo "WEBUI_BROWSER_FONT_CACHE_DIR=$RUNNER_TEMP/webui-browser-font-cache" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "WEBUI_BROWSER_HEADED=1" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check WebUI types
        if: matrix.lane.name == 'checks'
        run: pnpm typecheck:webui
      - name: Check WebUI dependency boundaries
        if: matrix.lane.name == 'checks'
        run: pnpm check:webui-dependency
      - name: Check WebUI presentation rules
        if: matrix.lane.name == 'checks'
        run: pnpm check:webui-presentation
      - name: Check WebUI motion rules
        if: matrix.lane.name == 'checks'
        run: pnpm check:webui-motion
      - name: Check WebUI overlays
        if: matrix.lane.name == 'checks'
        run: pnpm check:webui-overlays
      - name: Check WebUI feedback
        if: matrix.lane.name == 'checks'
        run: pnpm check:webui-feedback
      - name: Build WebUI
        if: matrix.lane.name != 'package'
        run: pnpm build:webui
      - name: Check WebUI build boundaries
        if: matrix.lane.name == 'checks'
        run: pnpm check:webui-boundary
      - name: Install Chromium
        if: matrix.lane.name == 'units' || matrix.lane.shard
        run: pnpm install:webui-browsers
      - name: Install FFmpeg
        if: matrix.lane.name == 'units' || matrix.lane.shard
        timeout-minutes: ${{ runner.os == 'Linux' && 15 || 8 }}
        shell: bash
        run: |
          # The native Design media paths run FFmpeg for real: the tests cut a
          # real clip, draw a real waveform and persist a real poster. Without
          # the binary on PATH they fail on `spawnSync ffmpeg ENOENT` rather
          # than on anything about the code under test. The Linux image ships
          # one already; the macOS and Windows images do not.
          verify_ffmpeg() {
            node -e 'require("node:child_process").execFileSync("ffmpeg", ["-version"], { stdio: "inherit" })'
          }
          if verify_ffmpeg; then
            exit 0
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            # Use the Gyan build linked from ffmpeg.org/download.html.
            ffmpeg_build="ffmpeg-9.0.2-essentials_build"
            ffmpeg_dir="$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/webui-ffmpeg.XXXXXX")"
            archive="$ffmpeg_dir/$ffmpeg_build.zip"
            curl --fail --location --retry 3 --retry-max-time 240 --max-time 90 \
              --output "$archive" \
              "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/$ffmpeg_build.zip"
            echo "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba  $archive" | sha256sum --check
            unzip -q "$archive" -d "$ffmpeg_dir"
            ffmpeg_bin="$ffmpeg_dir/$ffmpeg_build/bin"
            export PATH="$ffmpeg_bin:$PATH"
            cygpath -w "$ffmpeg_bin" >> "$GITHUB_PATH"
          fi
          if ! verify_ffmpeg; then
            echo "::error::FFmpeg is unavailable to Node after installation"
            exit 1
          fi
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux' && (matrix.lane.name == 'units' || matrix.lane.shard)
        run: pnpm exec playwright install-deps chromium
      - name: Test WebUI units and integrations
        if: matrix.lane.name == 'units'
        env:
          WEBUI_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/webui-browser-diagnostics/units
        run: pnpm test:webui
      - name: Test WebUI browser interactions
        if: matrix.lane.shard
        timeout-minutes: 30
        shell: bash
        env:
          WEBUI_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/webui-browser-diagnostics/browser
          WEBUI_BROWSER_SHARD: ${{ matrix.lane.shard }}
        run: pnpm test:webui-browser --shard="$WEBUI_BROWSER_SHARD"
      - name: Verify WebUI package installation
        if: matrix.lane.name == 'package'
        env:
          WEBUI_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/webui-browser-diagnostics/package
        run: pnpm test:webui-package
      - name: Upload WebUI browser diagnostics
        if: ${{ !cancelled() && matrix.lane.name != 'checks' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webui-${{ matrix.os }}-${{ matrix.lane.name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/webui-browser-diagnostics/
            ${{ runner.temp }}/webui-playwright-results/
          retention-days: 7
          if-no-files-found: ignore

name: tmp-regen-visual-baseline
on:
  push:
    branches: ["tmp/regen-visual-baseline"]
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:webui
      - run: pnpm exec playwright install --with-deps chromium
      - name: round one
        run: pnpm exec playwright test packages/webui/test/browser/visual-baselines.spec.mjs --update-snapshots
      - name: keep round one
        run: cp -r packages/webui/test/browser/visual-baselines.spec.mjs-snapshots /tmp/round1
      - name: round two
        run: pnpm exec playwright test packages/webui/test/browser/visual-baselines.spec.mjs --update-snapshots
      - name: compare the two rounds
        run: |
          set -euo pipefail
          diff -r /tmp/round1 packages/webui/test/browser/visual-baselines.spec.mjs-snapshots && echo "ROUNDS IDENTICAL"
      - uses: actions/upload-artifact@v4
        with:
          name: regen-round2
          path: packages/webui/test/browser/visual-baselines.spec.mjs-snapshots/
      - uses: actions/upload-artifact@v4
        with:
          name: regen-round1
          path: /tmp/round1/

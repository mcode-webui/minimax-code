name: WebUI macOS diagnostics

# Diagnostic branch only. Never merge this workflow into main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnostic ${{ matrix.runner }} (${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            channel: chromium
            mode: headed
            headed: true
            caffeinate: false
            inlineContain: "0"
    env:
      WEBUI_BROWSER_HEADED: "1"
      WEBUI_DIAG_INLINE_CONTAIN: ${{ matrix.inlineContain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Isolate diagnostic output
        run: echo "WEBUI_BROWSER_OUTPUT_DIR=$RUNNER_TEMP/mac-browser-${{ matrix.channel }}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:webui
      - run: pnpm install:webui-browsers
      - name: Repeat streaming and real attribution controls
        run: pnpm exec playwright test packages/webui/test/browser/streaming-performance.spec.mjs --headed --repeat-each=5
      - name: Retain diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-diagnostic-${{ matrix.runner }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/mac-browser-${{ matrix.channel }}/
          retention-days: 7
          if-no-files-found: ignore
